name: Verify

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # TypeScript is pinned to 5.9.3 because vue-tsc crashes on the TS 7 native
  # port: it patches typescript/lib/tsc, which TS 7 no longer exports.
  #
  # The assertion is deliberately inverted. This job PASSES while the pin is
  # still needed and FAILS when vue-tsc finally works against typescript@latest,
  # because that is the only outcome anyone has to act on. Reporting the
  # expected incompatibility as a failure would paint every pull request red
  # forever, which just teaches people to stop reading CI.
  typescript-canary:
    name: TypeScript pin canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Can the TypeScript 5.9.3 pin be lifted yet?
        run: |
          npm install --no-save typescript@latest
          version="$(npx tsc --version)"
          echo "Testing vue-tsc against $version"

          if npm run type-check; then
            echo "::error::vue-tsc now type-checks cleanly against $version. The TypeScript 5.9.3 pin in package.json can be lifted - see issue #5."
            exit 1
          fi

          echo "::notice::vue-tsc still cannot run against $version, so the TypeScript 5.9.3 pin stays. See issue #5."
