<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the player can use the full screen on notched
         devices; safe-area insets are handled in CSS. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Must match the body background exactly: it paints the browser chrome
         and the standalone splash, and any drift shows as a seam above the
         page. This is oklch(0.16 0.01 260) - --color-surface - in hex. -->
    <meta name="theme-color" content="#0b0d12" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <!-- iOS ignores the manifest's icons entirely. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta
      name="description"
      content="A guided 15-minute full-body dumbbell workout with a hands-free timer, audio cues and set logging. Works offline."
    />
    <title>15-Minute Full Body</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
